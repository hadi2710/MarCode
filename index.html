    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "name": "MarCode Growth",
            "url": "https://marcodegrowth.com/",
            "logo": "https://marcodegrowth.com/favicon-512.png",
            "email": "bd.marcodegrowth@gmail.com",
            "description": "AI chatbots, AI agents and workflow automations that reply to every enquiry in seconds, qualify leads and book meetings."
          },
          {
            "@type": "FAQPage",
            "mainEntity": [
              { "@type": "Question", "name": "How long does it take to go live?", "acceptedAnswer": { "@type": "Answer", "text": "Most projects take two to four weeks from the audit to a live agent, depending on how many channels and tools we connect." } },
              { "@type": "Question", "name": "Will it work with the tools we already use?", "acceptedAnswer": { "@type": "Answer", "text": "Yes. We deploy on your website, inbox and CRM, so your team keeps working the way it does today. We confirm every integration during the audit." } },
              { "@type": "Question", "name": "What happens when the AI can't answer something?", "acceptedAnswer": { "@type": "Answer", "text": "We design a handover so the conversation goes to the right person on your team, with the full history attached, instead of the customer getting a dead end." } },
              { "@type": "Question", "name": "Is our customer data safe?", "acceptedAnswer": { "@type": "Answer", "text": "Your agent only accesses the systems you approve, with the minimum permissions it needs. We agree what data it can see and store during the design phase, and you keep full ownership of every conversation." } },
              { "@type": "Question", "name": "Will customers know they're talking to AI?", "acceptedAnswer": { "@type": "Answer", "text": "We recommend being upfront about it. The agent introduces itself as an assistant and offers a person whenever the customer asks for one." } },
              { "@type": "Question", "name": "Does it keep improving after launch?", "acceptedAnswer": { "@type": "Answer", "text": "Yes. Each month we review real conversations, tune the answers and automations, and send you a report in plain language." } }
            ]
          }
        ]
      }
